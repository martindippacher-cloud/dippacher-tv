<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dippacher TV – Folien-Übersicht</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d120c;--card:#2a1a12;--line:#e9b44c55;--gold:#e9b44c;--cream:#f6ead6;--muted:#f6ead699}
*{box-sizing:border-box}
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;background:radial-gradient(ellipse at 20% 0%,#3a2216,#1d120c 60%);color:var(--cream);min-height:100vh}
header{padding:1.2rem 1.5rem .8rem;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-end}
h1{font-family:'Playfair Display',serif;margin:0;font-size:clamp(1.5rem,3vw,2.2rem);color:#fff}
.meta{color:var(--muted);font-size:.95rem;max-width:40rem;line-height:1.4;margin:.35rem 0 0}
.pill{display:inline-block;background:#3a2a18;border:1px solid var(--line);color:var(--gold);font-size:.72rem;font-weight:700;letter-spacing:.08em;padding:.2rem .55rem;border-radius:.3rem;margin-bottom:.35rem}
.toolbar a{display:inline-block;border:1px solid var(--gold);color:var(--gold);text-decoration:none;padding:.45rem .9rem;border-radius:.4rem;font-weight:600}
main{padding:1.2rem 1.5rem 2.5rem}
.hint{margin:0 0 1.1rem;padding:.85rem 1rem;border:1px dashed var(--line);border-radius:.55rem;background:#0003;color:var(--muted);font-size:.92rem;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.7rem;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 .5rem 1.4rem #0005}
.card.dim .preview{filter:grayscale(.7) brightness(.55)}
.preview{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
.preview iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none;background:#1d120c}
.preview .veil{position:absolute;inset:0;z-index:2}
.body{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.idx{font-size:.72rem;letter-spacing:.06em;color:var(--muted)}
.body h2{margin:0;font-size:1.08rem;line-height:1.25;color:#fff}
.sub{margin:0;color:var(--gold);font-size:.88rem}
.status{display:inline-flex;width:fit-content;font-size:.8rem;font-weight:600;padding:.22rem .55rem;border-radius:.35rem}
.status.live{background:#1e4d32;color:#b7f0c8}
.status.zeit,.status.geplant{background:#4a3a10;color:#ffd978}
.status.abgelaufen,.status.aus{background:#4a2020;color:#ffb4b4}
.status.heute-nicht{background:#403018;color:#e8c98a}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-top:auto;padding-top:.45rem;border-top:1px solid #e9b44c22}
.row a{color:var(--gold);text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid #e9b44c55;padding:.28rem .55rem;border-radius:.35rem}
footer{padding:0 1.5rem 2rem;color:var(--muted);font-size:.85rem;line-height:1.45}
code{background:#0005;padding:.05rem .3rem;border-radius:.25rem;color:var(--gold)}
@media(max-width:420px){.grid{grid-template-columns:1fr}header,main,footer{padding-left:1rem;padding-right:1rem}}
</style>
</head>
<body>
<header>
  <div>
    <div class="pill">NUR LESEN · Änderungen über Bot / Dateien</div>
    <h1>Folien-Übersicht</h1>
    <p class="meta">Miniaturen der Live-Folien. Reihenfolge aus <code>auswahl.json</code>. Schalten/Tauschen macht der Bot (keine Secrets hier).</p>
  </div>
  <div class="toolbar"><a href="./?alle" target="_blank" rel="noopener">TV-Vorschau</a></div>
</header>
<main>
  <p class="hint" id="clock"></p>
  <div class="grid" id="grid">Lade Folien …</div>
</main>
<footer>
  Anleitung: <code>FOLIEN.md</code> · Einzeldateien: <code>folien/&lt;id&gt;.json</code> · Reihenfolge: <code>auswahl.json</code>
</footer>
<script src="schedule.js"></script>
<script src="slides.js"></script>
<script>
(function(){
  const d=new Date();
  document.getElementById('clock').innerHTML='<strong>Jetzt:</strong> '+d.toLocaleString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})+' (Europe/Berlin am Gerät)';
  function scale(wrap,iframe){
    const go=()=>{iframe.style.transform='scale('+((wrap.clientWidth||320)/1920)+')'};
    go(); new ResizeObserver(go).observe(wrap);
  }
  loadFolien().then(FOLIEN=>{
    const grid=document.getElementById('grid'); grid.innerHTML='';
    FOLIEN.forEach((f,i)=>{
      const st=TVSchedule.statusInfo(f,d);
      const card=document.createElement('article');
      card.className='card'+(st.live?'':' dim');
      const title=f.titel+(f.unter?' · '+f.unter:'');
      card.innerHTML=
        '<div class="preview"><iframe loading="lazy" title="'+f.id+'" src="./?folie='+i+'&alle" tabindex="-1"></iframe><div class="veil"></div></div>'+
        '<div class="body">'+
          '<div class="idx">#'+i+' · <code>'+f.id+'</code>'+(f.dauer?' · '+f.dauer+'s':'')+(f.typ?' · '+f.typ:'')+'</div>'+
          '<h2>'+title+'</h2>'+
          (f.badge?'<p class="sub">Badge: '+f.badge+'</p>':'')+
          '<span class="status '+st.cls+'">'+st.label+'</span>'+
          '<div class="row"><span style="font-size:.8rem;color:var(--muted)">Reihenfolge '+(i+1)+'/'+FOLIEN.length+'</span>'+
          '<a href="./?folie='+i+'&alle" target="_blank" rel="noopener">Öffnen</a></div>'+
        '</div>';
      grid.appendChild(card);
      const iframe=card.querySelector('iframe'), preview=card.querySelector('.preview');
      iframe.addEventListener('load',()=>scale(preview,iframe));
      scale(preview,iframe);
    });
  }).catch(e=>{
    document.getElementById('grid').textContent='Fehler: '+e.message;
  });
})();
</script>
</body>
</html>
