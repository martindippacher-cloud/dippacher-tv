<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><title>Dippacher TV</title>
<meta name="viewport" content="width=1920">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#1d120c;font-family:'Source Sans 3',sans-serif;color:#f6ead6;cursor:none}
.f{position:absolute;inset:0;opacity:0;transition:opacity 1.5s;display:flex;align-items:center;background:radial-gradient(ellipse at 30% 40%,#4a2a18,#1d120c 75%)}
.f.on{opacity:1}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.38) saturate(1.05)}
.in{position:relative;display:flex;align-items:center;gap:6vw;padding:0 7vw;width:100%;box-sizing:border-box}
.txt{flex:1}
h1{font-family:'Playfair Display',serif;font-size:6.2vw;line-height:1.05;margin:0 0 1.5vh;color:#fff;text-shadow:0 .3vw 1vw #000}
h2{font-size:3vw;margin:0 0 3vh;color:#e9b44c;font-weight:600;text-shadow:0 .2vw .6vw #000}
p{font-size:2.3vw;margin:0;max-width:60vw;text-shadow:0 .2vw .6vw #000}
.qr{background:#fff;padding:1.2vw;border-radius:1vw;text-align:center;box-shadow:0 1vw 3vw #000a}
.qr img{width:18vw;display:block}.qr div{color:#5a1d16;font-size:1.35vw;font-weight:600;margin-top:.6vw}
.badge{display:inline-block;background:#A13036;color:#fff;font-size:1.6vw;font-weight:600;padding:.3vw 1.2vw;border-radius:.4vw;margin-bottom:2vh;letter-spacing:.15vw}
ul{list-style:none;padding:0;margin:0 0 3vh;font-size:2.6vw}
li{display:flex;justify-content:space-between;border-bottom:.15vw dotted #e9b44c88;padding:1.1vh 0;max-width:70vw}
li span:last-child{color:#e9b44c}
.bar{position:absolute;left:0;right:0;bottom:0;height:9vh;background:linear-gradient(transparent,#000c);display:flex;align-items:center;justify-content:space-between;padding:0 3vw;z-index:5}
.bar img{height:6.5vh;filter:drop-shadow(0 0 .4vw #000)}
#uhr{font-size:1.8vw;color:#f6ead6cc}
.rand{position:absolute;inset:1.2vw;border:.2vw solid #e9b44c55;border-radius:1vw;pointer-events:none;z-index:4}
/* Live-Bestand – große Schrift für 65-Zoll */
.f.bestand .in{padding:0 4vw 8vh;align-items:stretch}
.f.bestand h1{font-size:3.8vw;margin-bottom:.5vh}
.f.bestand h2{font-size:2vw;margin-bottom:1vh}
.bst{width:100%}
.bst-meta{font-size:1.5vw;color:#f6ead6aa;margin:0 0 1.5vh;text-shadow:0 .15vw .4vw #000}
.bst-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6vh 2.5vw}
.bst-row{display:grid;grid-template-columns:4.2vw minmax(0,1fr) 7.5vw 13vw;gap:.8vw;align-items:center;border-bottom:.12vw solid #e9b44c44;padding:.55vh 0;font-size:1.95vw}
.bst-row .fach{color:#e9b44c;font-weight:600;font-variant-numeric:tabular-nums}
.bst-row .name{color:#fff;font-weight:600;white-space:normal;overflow:visible;line-height:1.15;hyphens:manual}
.bst-row .preis{color:#e9b44c;text-align:right;font-variant-numeric:tabular-nums;align-self:center}
.bst-row .qty{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;align-self:center;white-space:nowrap}
.bst-row .fach{align-self:center}
.bst-row .qty.ok{color:#9fd89f}
.bst-row .qty.low{color:#e9b44c}
.bst-row .qty.out{color:#ff8a8a;letter-spacing:.04em}
.bst-err{font-size:2.4vw;color:#ffb4b4;margin-top:2vh;text-shadow:0 .2vw .6vw #000}
.bst-head{display:grid;grid-template-columns:4.2vw minmax(0,1fr) 7.5vw 13vw;gap:.8vw;font-size:1.3vw;color:#e9b44caa;text-transform:uppercase;letter-spacing:.08em;padding-bottom:.5vh;border-bottom:.15vw solid #e9b44c66;margin-bottom:.3vh}
.bst-head span:nth-child(3),.bst-head span:nth-child(4){text-align:right}
/* etwas kleinere Schrift, zweizeilige Namen möglich */
.bst-row{align-items:start;font-size:1.75vw;padding:.45vh 0}
.bst-row .name{font-size:1.75vw}
/* Vorbestell-Folie: kompakter, Abstand zur Logo-Leiste */
.f.kompakt .in{padding:0 7vw 13vh;align-items:center}
.f.kompakt h1{font-size:4.5vw;margin-bottom:.8vh}
.f.kompakt h2{font-size:2.2vw;margin-bottom:1.2vh}
.f.kompakt ul{font-size:2.05vw;margin:0 0 1vh;max-width:58vw}
.f.kompakt li{padding:.45vh 0}
.f.kompakt p{font-size:1.75vw;line-height:1.35;max-width:58vw;margin-bottom:0}
.f.kompakt .qr img{width:14vw}
.f.kompakt .qr div{font-size:1.15vw}
.glogo{background:#fff;padding:2.2vw 2.4vw;border-radius:1vw;text-align:center;box-shadow:0 1vw 3vw #000a;min-width:28vw}
.glogo img{display:block;margin:0 auto;width:26vw;max-width:520px;height:auto;object-fit:contain}
.glogo div{display:none}
.txt p{max-width:55vw}


/* Bild-/Video-Folien Vollbild */
.f.media{padding:0;align-items:stretch}
.f.media .media-full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.f.media .media-full.contain{object-fit:contain}
.f.media .media-cap{position:absolute;left:0;right:0;bottom:9vh;padding:1.5vh 4vw;background:linear-gradient(transparent,#000c);z-index:3}
.f.media .media-cap h1{font-size:3.2vw;margin:0 0 .4vh}
.f.media .media-cap h2{font-size:1.8vw;margin:0;color:#e9b44c}
/* Sofort-Einblendung Overlay */
#einblendung{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,6,4,.82);padding:6vw;box-sizing:border-box}
#einblendung.on{display:flex}
#einblendung .eb-box{max-width:70vw;text-align:center}
#einblendung h1{font-size:5vw;margin:0 0 2vh;color:#fff}
#einblendung p{font-size:2.6vw;margin:0;max-width:100%}
#einblendung img{max-width:50vw;max-height:45vh;border-radius:1vw;box-shadow:0 1vw 3vw #000a;margin-bottom:2vh}
#einblendung .eb-meta{margin-top:2.5vh;font-size:1.4vw;color:#e9b44caa}

</style></head><body>
<div id="s"></div><div class="rand"></div>
<div id="einblendung" aria-live="polite"></div>
<div class="bar"><img src="assets/logo.png" alt="Dippacher"><div id="uhr"></div></div>
<script src="schedule.js"></script>
<script src="slides.js"></script>
<script>
const P=new URLSearchParams(location.search),DAUER=15,BESTAND_MS=45000,VERSION_MS=60*1000,DAY_MS=24*60*60*1000,EINBL_MS=15*1000;
const eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function qtyLabel(q){q=Math.max(0,Number(q)||0);if(q<=0)return{t:'AUSVERKAUFT',c:'out'};if(q<=2)return{t:q+' Stück',c:'low'};return{t:q+' Stück',c:'ok'}}
function renderBestand(el,data,err,offlineAt){
  const box=el.querySelector('.bst');if(!box)return;
  if(err||!data){box.innerHTML='<p class="bst-err">'+esc(err||'Bestand gerade nicht erreichbar – bitte später erneut prüfen.')+'</p>';return}
  const items=[...(data.items||[])].sort((a,b)=>(Number(a.fach)||99)-(Number(b.fach)||99)||String(a.name).localeCompare(String(b.name),'de'));
  let when;
  if(offlineAt){
    const d=new Date(offlineAt);
    when='Stand von '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+' (offline)';
  } else {
    const stamp=data.checkedAt||data.updatedAt;
    when=stamp?new Date(stamp).toLocaleString('de-DE',{timeZone:'Europe/Berlin',weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' Uhr':'–';
    when='Stand: '+when;
  }
  const rows=items.map(i=>{const q=qtyLabel(i.quantity);return '<div class="bst-row"><span class="fach">'+esc(i.fach!=null?i.fach:'–')+'</span><span class="name">'+esc(i.name)+'</span><span class="preis">'+eur.format(Number(i.price)||0)+'</span><span class="qty '+q.c+'">'+q.t+'</span></div>'}).join('');
  box.innerHTML='<div class="bst-meta">'+esc(when)+' · Quelle: Food-Box Automat</div><div class="bst-head"><span>Fach</span><span>Artikel</span><span>Preis</span><span>Bestand</span></div><div class="bst-grid">'+rows+'</div>';
}
async function loadBestand(f,el){
  if(!f.dataUrl)return;
  const key='bestand-cache:'+f.dataUrl;
  const offline=!navigator.onLine;
  try{
    const r=await fetch(f.dataUrl,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!offline){
      try{localStorage.setItem(key, JSON.stringify({at:Date.now(), data:d}))}catch(err){}
      renderBestand(el,d,null,null);
    } else {
      let cached=null;
      try{cached=JSON.parse(localStorage.getItem(key)||'null')}catch(err){}
      const at=(cached&&cached.at)||Date.now();
      if(!cached||!cached.data){
        try{localStorage.setItem(key, JSON.stringify({at:at, data:d}))}catch(err){}
      }
      renderBestand(el, (cached&&cached.data)||d, null, at);
    }
  }catch(e){
    let cached=null;
    try{cached=JSON.parse(localStorage.getItem(key)||'null')}catch(err){}
    if(cached && cached.data){
      renderBestand(el, cached.data, null, cached.at||Date.now());
    } else {
      renderBestand(el,null,'Bestand offline – noch kein Cache vorhanden.',null);
    }
  }
}
function aktiv(f){return TVSchedule.aktiv(f, new Date(), P.has('alle'))}
function fitClass(f){return (f.fit==='contain')?'contain':'cover'}
function buildSlide(f){
  const e=document.createElement('div');
  const typ=f.typ||'html';
  e.className='f'+(typ==='bestand'?' bestand':'')+(typ==='bild'||typ==='video'?' media':'')+(f.klasse?' '+f.klasse:'');
  e.dataset.typ=typ;
  if(typ==='bestand'){
    e.innerHTML='<div class="in"><div class="txt" style="width:100%"><h1>'+esc(f.titel)+'</h1>'+(f.unter?'<h2>'+esc(f.unter)+'</h2>':'')+'<div class="bst"><p class="bst-meta">Lade Bestand …</p></div></div></div>';
    loadBestand(f,e);setInterval(function(){loadBestand(f,e)},BESTAND_MS);
  }else if(typ==='bild'){
    const src=f.datei||f.bild||'';
    e.innerHTML='<img class="media-full '+fitClass(f)+'" src="'+esc(src)+'" alt="">'+
      ((f.titel||f.unter)?'<div class="media-cap">'+(f.titel?'<h1>'+esc(f.titel)+'</h1>':'')+(f.unter?'<h2>'+esc(f.unter)+'</h2>':'')+'</div>':'');
  }else if(typ==='video'){
    const src=f.datei||'';
    e.innerHTML='<video class="media-full '+fitClass(f)+'" src="'+esc(src)+'" muted autoplay playsinline></video>'+
      ((f.titel||f.unter)?'<div class="media-cap">'+(f.titel?'<h1>'+esc(f.titel)+'</h1>':'')+(f.unter?'<h2>'+esc(f.unter)+'</h2>':'')+'</div>':'');
  }else{
    e.innerHTML=(f.bild?'<div class="bg" style="background-image:url(\''+f.bild+'\')"></div>':'')+'<div class="in"><div class="txt">'+(f.badge?'<div class="badge">'+f.badge+'</div>':'')+'<h1>'+f.titel+'</h1>'+(f.unter?'<h2>'+f.unter+'</h2>':'')+(f.liste?'<ul>'+f.liste.map(function(r){return '<li><span>'+r[0]+'</span><span>'+r[1]+'</span></li>'}).join('')+'</ul>':'')+(f.text?'<p>'+f.text+'</p>':'')+'</div>'+(f.logo?'<div class="glogo"><img src="'+f.logo+'" alt=""></div>':(f.qr?'<div class="qr"><img src="'+f.qr+'"><div>'+f.link+'</div></div>':''))+'</div>';
  }
  return e;
}
function slideDauer(f, el){
  if(f.dauer) return f.dauer*1000;
  if((f.typ||'')==='video'){
    const v=el&&el.querySelector('video');
    if(v && isFinite(v.duration) && v.duration>0) return Math.ceil(v.duration*1000);
    return 30000;
  }
  return DAUER*1000;
}
function startPlayer(FOLIEN){
  const S=document.getElementById('s'); S.innerHTML='';
  const els=FOLIEN.map(f=>{const e=buildSlide(f); S.appendChild(e); return e});
  let i=-1, timer=null;
  function show(k){
    i=k; els.forEach(function(e,j){e.classList.toggle('on',j===i)});
    const v=els[i]&&els[i].querySelector('video');
    if(v){try{v.currentTime=0; v.play().catch(function(){})}catch(err){}}
  }
  function next(){
    const idx=FOLIEN.map(function(f,k){return k}).filter(function(k){return aktiv(FOLIEN[k])});
    if(!idx.length){timer=setTimeout(next,5000);return}
    const ni=idx[(idx.indexOf(i)+1)%idx.length];
    const k=(ni==null?idx[0]:ni);
    show(k);
    clearTimeout(timer);
    function arm(ms){clearTimeout(timer); timer=setTimeout(next, ms)}
    const v=els[k]&&els[k].querySelector('video');
    if(v && !FOLIEN[k].dauer){
      const use=()=>arm(slideDauer(FOLIEN[k], els[k]));
      if(isFinite(v.duration)&&v.duration>0) use();
      else {
        v.addEventListener('loadedmetadata', use, {once:true});
        arm(35000);
      }
      v.onended=function(){arm(50)};
    } else arm(slideDauer(FOLIEN[k], els[k]));
  }
  if(P.has('folie')){
    const n=+P.get('folie');
    if(els[n]){show(n); els[n].style.opacity='1'}
  } else next();
  function uhr(){document.getElementById('uhr').textContent=new Date().toLocaleString('de-DE',{weekday:'long',day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'})}
  uhr();setInterval(uhr,10000);
  // Version-Polling statt starrer 5-Min-Reload
  if(!P.has('folie')){
    let curVer=null, started=Date.now();
    async function checkVersion(){
      try{
        const r=await fetch('version.json',{cache:'no-store'});
        if(!r.ok) return;
        const j=await r.json();
        const v=String(j.version||'');
        if(curVer===null){curVer=v;return}
        if(v && v!==curVer){location.reload();return}
      }catch(e){}
      if(Date.now()-started>=DAY_MS) location.reload();
    }
    checkVersion();
    setInterval(checkVersion, VERSION_MS);
  }
}

/* Sofort-Einblendung */
function einblendungAktiv(eb, d){
  if(!eb || eb.aktiv===false) return false;
  d=d||new Date();
  if(eb.bis){
    const t=Date.parse(eb.bis);
    if(!isNaN(t) && d.getTime()>t) return false;
  }
  if(eb.wiederholung && window.TVSchedule){
    // nutzt zeit/tage aus wiederholung
    const fake={zeit:eb.wiederholung.zeit, tage:eb.wiederholung.tage, aktiv:true};
    if(!TVSchedule.aktiv(fake,d,false)) return false;
  }
  // braucht Inhalt
  if(!(eb.text||eb.titel||eb.bild)) return false;
  return true;
}
function renderEinblendung(eb){
  const box=document.getElementById('einblendung'); if(!box) return;
  if(!einblendungAktiv(eb)){box.classList.remove('on'); box.innerHTML=''; return}
  box.innerHTML='<div class="eb-box">'+(eb.bild?'<img src="'+esc(eb.bild)+'" alt="">':'')+
    (eb.titel?'<h1>'+esc(eb.titel)+'</h1>':'')+
    (eb.text?'<p>'+esc(eb.text).replace(/\n/g,'<br>')+'</p>':'')+
    (eb.bis?'<div class="eb-meta">bis '+esc(new Date(eb.bis).toLocaleString('de-DE'))+'</div>':'')+
    '</div>';
  box.classList.add('on');
}
async function pollEinblendung(){
  try{
    const r=await fetch('einblendung.json',{cache:'no-store'});
    if(!r.ok) return;
    renderEinblendung(await r.json());
  }catch(e){}
}

loadFolien().then(function(FOLIEN){
  startPlayer(FOLIEN);
  pollEinblendung();
  if(!P.has('folie')) setInterval(pollEinblendung, EINBL_MS);
  // Einblendung auch bei ?folie= zeigen (Vorschau)
  else { pollEinblendung(); setInterval(pollEinblendung, EINBL_MS); }
}).catch(err=>{
  document.getElementById('s').innerHTML='<div class="f on" style="opacity:1;padding:4vw;font-size:2vw">Folien konnten nicht geladen werden: '+esc(err.message)+'</div>';
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('SW',e)});
}
</script></body></html>
